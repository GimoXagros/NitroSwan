name: Build

on:
  push:
    branches:
      - '*'
  pull_request:
  workflow_dispatch:

jobs:
  build-nds:
    name: Build and validate
    runs-on: ubuntu-latest
    container: skylyrac/blocksds:slim-latest
    steps:
      - name: Clone project
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install validation runtime
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc libc6-dev python3

      - name: Validate localization and font coverage
        run: python3 tools/validate_localization.py

      - name: Run core regression tests
        run: python3 tools/run_core_regressions.py

      - name: Build DS version
        run: make -j2 NAME=NitroSwan-DS-0.7.7-custom.r3

      - name: Build DSi/DSpico version
        run: |
          make -j2 NAME=NitroSwan-DSi-0.7.7-custom.r3 DSPICO_3DS_BUILD=1 \
            SPECS="$BLOCKSDS/sys/crts/dsi_arm9.specs"

      - name: Archive artifacts
        uses: actions/upload-artifact@v7
        with:
          name: NitroSwan-0.7.7-custom.r3
          path: |
            History.txt
            NitroSwan-DS-0.7.7-custom.r3.nds
            NitroSwan-DSi-0.7.7-custom.r3.nds
            README.md
            WonderWitch.md
