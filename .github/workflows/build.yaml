name: Build

on:
  push:
    branches:
      - '*'
  pull_request:
  workflow_dispatch:

jobs:
  build-nds:
    name: Build and validate
    runs-on: ubuntu-latest
    container: skylyrac/blocksds:slim-latest
    steps:
      - name: Clone project
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install validation runtime
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc libc6-dev python3 python3-venv
          python3 -m venv /tmp/nitroswan-validation
          /tmp/nitroswan-validation/bin/pip install unicorn==2.1.4 pyelftools==0.32

      - name: Validate repository hygiene
        run: |
          # Checkout's temporary HOME does not carry into container run steps.
          # Trust only this job's checked-out repository, never a wildcard.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 tools/validate_repository.py

      - name: Validate localization and font coverage
        run: python3 tools/validate_localization.py

      - name: Run core regression tests
        env:
          REQUIRE_HOST_CC: '1'
        run: python3 tools/run_core_regressions.py

      - name: Build DS version
        run: make -j2 NAME=NitroSwan-DS-r9-motion-test

      - name: Build DSi/DSpico version
        run: |
          make -j2 NAME=NitroSwan-DSi-r9-motion-test DSPICO_3DS_BUILD=1 \
            SPECS="$BLOCKSDS/sys/crts/dsi_arm9.specs"

      - name: Validate linked renderer ABI
        run: |
          python3 tools/validate_renderer_abi.py \
            --build-dir build/NitroSwan-DS-r9-motion-test \
            --objdump /opt/wonderful/toolchain/gcc-arm-none-eabi/bin/arm-none-eabi-objdump
          python3 tools/validate_renderer_abi.py \
            --build-dir build/NitroSwan-DSi-r9-motion-test \
            --objdump /opt/wonderful/toolchain/gcc-arm-none-eabi/bin/arm-none-eabi-objdump

      - name: Execute linked ARM renderer regressions
        run: |
          /tmp/nitroswan-validation/bin/python tools/validate_renderer_runtime.py build/NitroSwan-DS-r9-motion-test.elf
          /tmp/nitroswan-validation/bin/python tools/validate_renderer_runtime.py build/NitroSwan-DSi-r9-motion-test.elf

      - name: Execute linked ARM sprite visibility regressions
        run: |
          /tmp/nitroswan-validation/bin/python tools/validate_character_motion_runtime.py build/NitroSwan-DS-r9-motion-test.elf
          /tmp/nitroswan-validation/bin/python tools/validate_character_motion_runtime.py build/NitroSwan-DSi-r9-motion-test.elf

      - name: Validate executable headers and embedded banners
        run: |
          python3 tools/validate_nds.py --ds NitroSwan-DS-r9-motion-test.nds \
            --dsi NitroSwan-DSi-r9-motion-test.nds

      - name: Archive artifacts
        uses: actions/upload-artifact@v7
        with:
          name: NitroSwan-r9-character-motion-test
          path: |
            History.txt
            NitroSwan-DS-r9-motion-test.nds
            NitroSwan-DSi-r9-motion-test.nds
            README.md
            WonderWitch.md
            NitroSwan_todo.txt
            Docs/ReleaseValidation-r8.md
            Docs/StabilityOptimization-r8.md
            Docs/ReleaseValidation-r9.md
            Docs/CharacterMotion-r9.md
