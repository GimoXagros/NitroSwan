name: Build

on:
  push:
    branches:
      - '*'
  pull_request:
  workflow_dispatch:

jobs:
  build-nds:
    name: Build and validate
    runs-on: ubuntu-latest
    container: skylyrac/blocksds:slim-latest
    steps:
      - name: Clone project
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install validation runtime
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc libc6-dev python3

      - name: Validate repository hygiene
        run: |
          # Checkout's temporary HOME does not carry into container run steps.
          # Trust only this job's checked-out repository, never a wildcard.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 tools/validate_repository.py

      - name: Validate localization and font coverage
        run: python3 tools/validate_localization.py

      - name: Run core regression tests
        env:
          REQUIRE_HOST_CC: '1'
        run: python3 tools/run_core_regressions.py

      - name: Build DS version
        run: make -j2 NAME=NitroSwan-DS-0.7.7-custom.r7

      - name: Build DSi/DSpico version
        run: |
          make -j2 NAME=NitroSwan-DSi-0.7.7-custom.r7 DSPICO_3DS_BUILD=1 \
            SPECS="$BLOCKSDS/sys/crts/dsi_arm9.specs"

      - name: Validate executable headers and embedded banners
        run: |
          python3 tools/validate_nds.py --ds NitroSwan-DS-0.7.7-custom.r7.nds \
            --dsi NitroSwan-DSi-0.7.7-custom.r7.nds

      - name: Archive artifacts
        uses: actions/upload-artifact@v7
        with:
          name: NitroSwan-0.7.7-custom.r7
          path: |
            History.txt
            NitroSwan-DS-0.7.7-custom.r7.nds
            NitroSwan-DSi-0.7.7-custom.r7.nds
            README.md
            WonderWitch.md
            NitroSwan_todo.txt
            Docs/ReleaseValidation-r7.md
